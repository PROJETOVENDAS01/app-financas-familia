<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças da Família</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f8fafc;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--light); color: var(--dark); }
        header { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 2rem; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 2rem; font-weight: 700; margin: 0; }
        .subtitle { font-size: 0.9rem; opacity: 0.9; margin-top: 0.25rem; }
        .header-top { display: flex; justify-content: space-between; align-items: center; gap: 2rem; }
        nav { background: white; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 99; }
        .nav-tabs { max-width: 1200px; margin: 0 auto; display: flex; padding: 0 2rem; }
        .nav-tabs button { padding: 1rem 1.5rem; border: none; background: none; cursor: pointer; color: var(--gray); font-weight: 500; border-bottom: 3px solid transparent; transition: 0.3s; }
        .nav-tabs button:hover { color: var(--dark); }
        .nav-tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .tab { display: none; }
        .tab.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.3); }
        .btn-small { padding: 0.5rem 1rem; font-size: 0.85rem; }
        .btn-edit { background: #e0e7ff; color: #4f46e5; margin-right: 0.5rem; }
        .btn-edit:hover { background: #c7d2fe; }
        .btn-delete { background: #fee2e2; color: #dc2626; }
        .btn-delete:hover { background: #fecaca; }
        .btn-copy { background: #dbeafe; color: #0284c7; }
        .card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.07); transition: 0.3s; }
        .card:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card h3 { margin: 0 0 1.5rem 0; font-size: 1.25rem; font-weight: 700; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .metric { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .metric.success { background: linear-gradient(135deg, var(--success) 0%, #059669 100%); }
        .metric.danger { background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%); }
        .metric.warning { background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%); }
        .metric-label { font-size: 0.9rem; opacity: 0.9; margin-bottom: 0.5rem; }
        .metric-value { font-size: 2rem; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--light); }
        th { padding: 1rem; text-align: left; font-weight: 600; color: var(--gray); font-size: 0.85rem; border-bottom: 2px solid var(--border); }
        td { padding: 1.25rem 1rem; border-bottom: 1px solid var(--border); }
        tbody tr:hover { background: var(--light); }
        .badge { display: inline-block; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .badge-food { background: #bfdbfe; color: #1e40af; }
        .badge-transport { background: #fed7aa; color: #92400e; }
        .badge-entertainment { background: #fecaca; color: #7f1d1d; }
        .badge-utilities { background: #d1fae5; color: #065f46; }
        .badge-health { background: #ddd6fe; color: #4c1d95; }
        .badge-income { background: #d1fae5; color: #065f46; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-header { padding: 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { margin: 0; font-size: 1.5rem; font-weight: 700; }
        .modal-body { padding: 2rem; }
        .modal-footer { padding: 2rem; border-top: 1px solid var(--border); display: flex; gap: 1rem; justify-content: flex-end; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .chart-container { position: relative; height: 300px; margin-bottom: 2rem; }
        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .member-card { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; }
        .member-card .actions { position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; }
        .member-avatar { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.25rem; margin-bottom: 1rem; }
        .member-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .member-info { font-size: 0.9rem; opacity: 0.9; margin-bottom: 0.25rem; }
        .toast { position: fixed; bottom: 2rem; right: 2rem; background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-left: 4px solid var(--primary); z-index: 2000; animation: slideIn 0.3s; }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .actions { display: flex; gap: 0.5rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gray); }
        .close-btn:hover { color: var(--dark); }
        @media (max-width: 768px) { main { padding: 1rem; } .card { padding: 1.5rem; } .header-top { flex-direction: column; } h1 { font-size: 1.5rem; } }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <div>
                    <h1>💰 Finanças da Família</h1>
                    <p class="subtitle">Controle profissional das suas finanças</p>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button class="btn btn-primary" onclick="abrirModalTransacao()">+ Transação</button>
                    <button class="btn btn-primary" onclick="abrirModalMembro()">+ Membro</button>
                </div>
            </div>
        </div>
    </header>

    <nav>
        <div class="container">
            <div class="nav-tabs">
                <button class="active" onclick="mudarAba('dashboard')">📊 Dashboard</button>
                <button onclick="mudarAba('transacoes')">📝 Transações</button>
                <button onclick="mudarAba('categorias')">🏷️ Categorias</button>
                <button onclick="mudarAba('membros')">👥 Membros</button>
            </div>
        </div>
    </nav>

    <main>
        <!-- DASHBOARD -->
        <div id="dashboard" class="tab active">
            <div class="metrics" id="metricas"></div>
            <div class="card">
                <h3>Gastos por Categoria</h3>
                <div class="chart-container"><canvas id="chartCategoria"></canvas></div>
            </div>
            <div class="card">
                <h3>Fluxo de Caixa</h3>
                <div class="chart-container"><canvas id="chartFluxo"></canvas></div>
            </div>
            <div class="card">
                <h3>Últimas Transações</h3>
                <table id="tabelaRecentes"></table>
            </div>
        </div>

        <!-- TRANSAÇÕES -->
        <div id="transacoes" class="tab">
            <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                <h2>Transações</h2>
                <button class="btn btn-primary" onclick="abrirModalTransacao()">+ Nova</button>
            </div>
            <div class="card">
                <table id="tabelaTransacoes"></table>
            </div>
        </div>

        <!-- CATEGORIAS -->
        <div id="categorias" class="tab">
            <h2 style="margin-bottom: 2rem;">Orçamento por Categoria</h2>
            <div id="categoriasContainer"></div>
        </div>

        <!-- MEMBROS -->
        <div id="membros" class="tab">
            <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                <h2>Membros da Família</h2>
                <button class="btn btn-primary" onclick="abrirModalMembro()">+ Novo</button>
            </div>
            <div class="members-grid" id="membrosCards"></div>
            <div class="card">
                <h3>Detalhes dos Membros</h3>
                <table id="tabelaMembros"></table>
            </div>
        </div>
    </main>

    <!-- MODAL TRANSAÇÃO -->
    <div id="modalTransacao" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="titleTransacao">Adicionar Transação</h2>
                <button class="close-btn" onclick="fecharModal('modalTransacao')">✕</button>
            </div>
            <form onsubmit="salvarTransacao(event)">
                <div class="modal-body">
                    <input type="hidden" id="idTransacao">
                    <div class="form-group">
                        <label>Tipo</label>
                        <select id="tipoTransacao" required>
                            <option value="expense">Despesa</option>
                            <option value="income">Receita</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" id="descricao" required>
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="valor" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="categoria" required>
                            <option value="">Selecione</option>
                            <option value="Alimentação">Alimentação</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Entretenimento">Entretenimento</option>
                            <option value="Utilidades">Utilidades</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Moradia">Moradia</option>
                            <option value="Renda">Renda</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Membro</label>
                        <select id="membro" required>
                            <option value="">Selecione</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" id="replicarAno"> Replicar para todos os meses do ano</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="fecharModal('modalTransacao')" style="background: #e2e8f0; color: #475569;">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL MEMBRO -->
    <div id="modalMembro" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="titleMembro">Adicionar Membro</h2>
                <button class="close-btn" onclick="fecharModal('modalMembro')">✕</button>
            </div>
            <form onsubmit="salvarMembro(event)">
                <div class="modal-body">
                    <input type="hidden" id="idMembro">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="nomeMembro" required>
                    </div>
                    <div class="form-group">
                        <label>Orçamento Mensal (R$)</label>
                        <input type="number" id="budgetMembro" step="0.01" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="fecharModal('modalMembro')" style="background: #e2e8f0; color: #475569;">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        let transacoes = [];
        let membros = [];
        const categorias = ['Alimentação', 'Transporte', 'Entretenimento', 'Utilidades', 'Saúde', 'Moradia'];
        const coresCategoria = {
            'Alimentação': '#3b82f6',
            'Transporte': '#f59e0b',
            'Entretenimento': '#ef4444',
            'Utilidades': '#10b981',
            'Saúde': '#8b5cf6',
            'Renda': '#06b6d4',
            'Moradia': '#6366f1'
        };

        // Servidor usa tipo despesa/receita; o app usa type expense/income
        const doServidor = t => ({ id: t.id, type: t.tipo === 'receita' ? 'income' : 'expense', descricao: t.descricao, valor: t.valor, categoria: t.categoria, membro: t.membro, data: t.data });
        const paraServidor = t => ({ id: t.id, tipo: t.type === 'income' ? 'receita' : 'despesa', descricao: t.descricao, valor: t.valor, categoria: t.categoria, membro: t.membro, data: t.data });

        // Chamada autenticada. A chave é pedida uma vez e guardada neste navegador; 401 pede de novo.
        async function api(metodo, caminho, corpo) {
            for (;;) {
                const chave = localStorage.getItem('apiKey') || prompt('Chave de acesso do app (API_KEY):');
                if (!chave) throw new Error('sem chave');
                localStorage.setItem('apiKey', chave);
                const r = await fetch(caminho, {
                    method: metodo,
                    headers: { 'Authorization': 'Bearer ' + chave, 'Content-Type': 'application/json' },
                    body: corpo ? JSON.stringify(corpo) : undefined
                });
                if (r.status === 401) { localStorage.removeItem('apiKey'); continue; }
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            }
        }

        async function carregar() {
            try {
                const lista = (await api('GET', '/api/transacoes')).map(doServidor);
                transacoes = lista.sort((a, b) => b.data.localeCompare(a.data) || b.id - a.id);
                localStorage.setItem('transacoes', JSON.stringify(transacoes));
            } catch (e) {
                transacoes = JSON.parse(localStorage.getItem('transacoes') || '[]');
                toast('Sem conexão com o servidor: mostrando dados salvos', 'error');
            }
            renderizar();
            setTimeout(() => renderizarGraficos(), 100);
        }

        async function init() {
            membros = JSON.parse(localStorage.getItem('membros') || '[]');

            if (!membros.length) {
                membros = [
                    { id: 1, nome: 'João', budget: 1000 },
                    { id: 2, nome: 'Maria', budget: 800 },
                    { id: 3, nome: 'Laura', budget: 500 }
                ];
            }
            
            localStorage.setItem('membros', JSON.stringify(membros));

            document.getElementById('data').valueAsDate = new Date();
            preencherMembros();
            await carregar();
            // Atualiza a cada 30s para ver o que o outro lançou (app ou WhatsApp)
            setInterval(() => { if (!document.hidden && localStorage.getItem('apiKey')) carregar(); }, 30000);
        }

        function abrirModalTransacao(id = null) {
            const modal = document.getElementById('modalTransacao');
            const form = modal.querySelector('form');
            
            if (id) {
                const t = transacoes.find(x => x.id === id);
                if (t) {
                    document.getElementById('titleTransacao').textContent = 'Editar Transação';
                    document.getElementById('idTransacao').value = id;
                    document.getElementById('tipoTransacao').value = t.type;
                    document.getElementById('descricao').value = t.descricao;
                    document.getElementById('valor').value = t.valor;
                    document.getElementById('categoria').value = t.categoria;
                    document.getElementById('membro').value = t.membro;
                    document.getElementById('data').value = t.data;
                    document.getElementById('replicarAno').checked = false;
                }
            } else {
                document.getElementById('titleTransacao').textContent = 'Adicionar Transação';
                form.reset();
                document.getElementById('idTransacao').value = '';
                document.getElementById('data').valueAsDate = new Date();
            }
            modal.classList.add('active');
        }

        async function salvarTransacao(e) {
            e.preventDefault();
            
            const id = document.getElementById('idTransacao').value;
            const trans = {
                id: id ? parseInt(id) : Date.now(),
                type: document.getElementById('tipoTransacao').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value),
                categoria: document.getElementById('categoria').value,
                membro: document.getElementById('membro').value,
                data: document.getElementById('data').value
            };

            let chamadas; // o que enviar ao servidor
            if (id) {
                const idx = transacoes.findIndex(t => t.id === parseInt(id));
                if (idx >= 0) transacoes[idx] = trans;
                chamadas = [() => api('PUT', '/api/transacoes/' + trans.id, paraServidor(trans))];
                toast('Transação atualizada!', 'success');
            } else if (document.getElementById('replicarAno').checked) {
                const [ano, mes, dia] = document.getElementById('data').value.split('-');
                const copias = [];
                for (let m = 1; m <= 12; m++) {
                    copias.push({
                        ...trans,
                        id: Date.now() + m,
                        data: `2025-${String(m).padStart(2, '0')}-${dia}`
                    });
                }
                transacoes.push(...copias);
                chamadas = copias.map(c => () => api('POST', '/api/transacoes', paraServidor(c)));
                toast('Replicado para 12 meses!', 'success');
            } else {
                transacoes.unshift(trans);
                chamadas = [() => api('POST', '/api/transacoes', paraServidor(trans))];
                toast('Transação adicionada!', 'success');
            }

            localStorage.setItem('transacoes', JSON.stringify(transacoes));
            fecharModal('modalTransacao');
            renderizar();
            setTimeout(() => renderizarGraficos(), 100);
            await sincronizar(chamadas);
        }

        // Envia ao servidor; se falhar, avisa e recarrega o que o servidor tem
        async function sincronizar(chamadas) {
            try {
                for (const c of chamadas) await c();
            } catch (e) {
                toast('Falha ao salvar no servidor', 'error');
                await carregar();
            }
        }

        function excluirTransacao(id) {
            if (confirm('Excluir transação?')) {
                transacoes = transacoes.filter(t => t.id !== id);
                localStorage.setItem('transacoes', JSON.stringify(transacoes));
                renderizar();
                setTimeout(() => renderizarGraficos(), 100);
                toast('Transação excluída!', 'success');
                sincronizar([() => api('DELETE', '/api/transacoes/' + id)]);
            }
        }

        function abrirModalMembro(id = null) {
            const modal = document.getElementById('modalMembro');
            if (id) {
                const m = membros.find(x => x.id === id);
                if (m) {
                    document.getElementById('titleMembro').textContent = 'Editar Membro';
                    document.getElementById('idMembro').value = id;
                    document.getElementById('nomeMembro').value = m.nome;
                    document.getElementById('budgetMembro').value = m.budget;
                }
            } else {
                document.getElementById('titleMembro').textContent = 'Adicionar Membro';
                modal.querySelector('form').reset();
                document.getElementById('idMembro').value = '';
            }
            modal.classList.add('active');
        }

        function salvarMembro(e) {
            e.preventDefault();
            const id = document.getElementById('idMembro').value;
            const nome = document.getElementById('nomeMembro').value;
            const budget = parseFloat(document.getElementById('budgetMembro').value);

            if (id) {
                const m = membros.find(x => x.id === parseInt(id));
                if (m) { m.nome = nome; m.budget = budget; }
                toast('Membro atualizado!', 'success');
            } else {
                membros.push({ id: Date.now(), nome, budget });
                toast('Membro adicionado!', 'success');
            }

            localStorage.setItem('membros', JSON.stringify(membros));
            fecharModal('modalMembro');
            preencherMembros();
            renderizar();
        }

        function excluirMembro(id) {
            if (confirm('Excluir membro?')) {
                membros = membros.filter(m => m.id !== id);
                localStorage.setItem('membros', JSON.stringify(membros));
                renderizar();
                preencherMembros();
                toast('Membro excluído!', 'success');
            }
        }

        function preencherMembros() {
            const select = document.getElementById('membro');
            select.innerHTML = '<option value="">Selecione</option>' + membros.map(m => `<option value="${m.nome}">${m.nome}</option>`).join('');
        }

        function fecharModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function mudarAba(aba) {
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(aba).classList.add('active');
            document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            if (aba === 'dashboard') setTimeout(() => renderizarGraficos(), 100);
        }

        function renderizar() {
            const receitas = transacoes.filter(t => t.type === 'income').reduce((a, t) => a + t.valor, 0);
            const despesas = transacoes.filter(t => t.type === 'expense').reduce((a, t) => a + t.valor, 0);
            const saldo = receitas - despesas;

            document.getElementById('metricas').innerHTML = `
                <div class="metric"><div class="metric-label">Saldo Total</div><div class="metric-value">R$ ${saldo.toFixed(2).replace('.', ',')}</div></div>
                <div class="metric success"><div class="metric-label">Receitas</div><div class="metric-value">R$ ${receitas.toFixed(2).replace('.', ',')}</div></div>
                <div class="metric danger"><div class="metric-label">Despesas</div><div class="metric-value">R$ ${despesas.toFixed(2).replace('.', ',')}</div></div>
                <div class="metric warning"><div class="metric-label">Taxa Economia</div><div class="metric-value">${receitas > 0 ? ((receitas - despesas) / receitas * 100).toFixed(1) : 0}%</div></div>
            `;

            let html = '<thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Membro</th><th style="text-align:right;">Valor</th><th>Ações</th></tr></thead><tbody>';
            transacoes.forEach(t => {
                html += `<tr>
                    <td>${new Date(t.data).toLocaleDateString('pt-BR')}</td>
                    <td>${t.descricao}</td>
                    <td><span class="badge badge-${t.categoria.toLowerCase().replace(/[^a-z]/g, '')}">${t.categoria}</span></td>
                    <td>${t.membro}</td>
                    <td style="text-align:right;color:${t.type === 'income' ? '#10b981' : '#ef4444'};font-weight:bold;">${t.type === 'income' ? '+' : '-'} R$ ${t.valor.toFixed(2).replace('.', ',')}</td>
                    <td><div class="actions"><button class="btn btn-edit btn-small" onclick="abrirModalTransacao(${t.id})">✏️ Editar</button><button class="btn btn-delete btn-small" onclick="excluirTransacao(${t.id})">🗑️ Excluir</button></div></td>
                </tr>`;
            });
            document.getElementById('tabelaTransacoes').innerHTML = html + '</tbody>';
            document.getElementById('tabelaRecentes').innerHTML = html.split('tbody>')[0] + 'tbody>' + html.split('tbody>')[1].split('</tr>').slice(0, 5).join('</tr>') + '</tbody>';

            let catHtml = '';
            categorias.forEach(cat => {
                const gasto = transacoes.filter(t => t.categoria === cat && t.type === 'expense').reduce((a, t) => a + t.valor, 0);
                const budget = cat === 'Alimentação' ? 800 : cat === 'Transporte' ? 300 : cat === 'Entretenimento' ? 400 : cat === 'Utilidades' ? 500 : cat === 'Saúde' ? 250 : 2000;
                const pct = Math.min((gasto / budget) * 100, 100);
                catHtml += `<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:1rem;"><h4 style="margin:0;">${cat}</h4><span>R$ ${gasto.toFixed(2).replace('.', ',')} / R$ ${budget}</span></div><div style="width:100%;height:10px;background:#e2e8f0;border-radius:5px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${gasto > budget ? '#ef4444' : coresCategoria[cat]};"></div></div></div>`;
            });
            document.getElementById('categoriasContainer').innerHTML = catHtml;

            let memHtml = '';
            membros.forEach(m => {
                const gasto = transacoes.filter(t => t.membro === m.nome && t.type === 'expense').reduce((a, t) => a + t.valor, 0);
                const disp = m.budget - gasto;
                memHtml += `<div class="member-card"><div class="actions"><button class="btn btn-edit btn-small" onclick="abrirModalMembro(${m.id})">✏️</button><button class="btn btn-delete btn-small" onclick="excluirMembro(${m.id})">🗑️</button></div><div class="member-avatar">${m.nome[0]}</div><div class="member-name">${m.nome}</div><div class="member-info">Orçamento: R$ ${m.budget}</div><div class="member-info">Gasto: R$ ${gasto.toFixed(2).replace('.', ',')}</div><div class="member-info" style="color:${disp >= 0 ? '#10b981' : '#ef4444'};">Disponível: R$ ${disp.toFixed(2).replace('.', ',')}</div></div>`;
            });
            document.getElementById('membrosCards').innerHTML = memHtml;

            let tabMem = '<thead><tr><th>Membro</th><th>Orçamento</th><th>Gasto</th><th>Disponível</th><th>Status</th></tr></thead><tbody>';
            membros.forEach(m => {
                const gasto = transacoes.filter(t => t.membro === m.nome && t.type === 'expense').reduce((a, t) => a + t.valor, 0);
                const disp = m.budget - gasto;
                tabMem += `<tr><td>${m.nome}</td><td>R$ ${m.budget}</td><td style="color:#ef4444;">R$ ${gasto.toFixed(2).replace('.', ',')}</td><td style="color:${disp >= 0 ? '#10b981' : '#ef4444'};">R$ ${disp.toFixed(2).replace('.', ',')}</td><td>${disp >= 0 ? '✓ OK' : '✗ Limite'}</td></tr>`;
            });
            document.getElementById('tabelaMembros').innerHTML = tabMem + '</tbody>';
        }

        function renderizarGraficos() {
            const dadosCat = categorias.map(c => ({
                name: c,
                value: transacoes.filter(t => t.categoria === c && t.type === 'expense').reduce((a, t) => a + t.valor, 0)
            })).filter(d => d.value > 0);

            const ctx1 = document.getElementById('chartCategoria')?.getContext('2d');
            if (ctx1) {
                new Chart(ctx1, {
                    type: 'doughnut',
                    data: {
                        labels: dadosCat.map(d => d.name),
                        datasets: [{
                            data: dadosCat.map(d => d.value),
                            backgroundColor: dadosCat.map(d => coresCategoria[d.name] || '#999'),
                            borderColor: 'white',
                            borderWidth: 2
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'bottom' } } }
                });
            }

            const meses = {};
            transacoes.forEach(t => {
                const m = t.data.substring(0, 7);
                if (!meses[m]) meses[m] = { income: 0, expense: 0 };
                if (t.type === 'income') meses[m].income += t.valor;
                else meses[m].expense += t.valor;
            });
            const dadosFluxo = Object.entries(meses).sort(([a], [b]) => a.localeCompare(b)).map(([m, d]) => ({ name: m, income: d.income, expense: d.expense }));

            const ctx2 = document.getElementById('chartFluxo')?.getContext('2d');
            if (ctx2) {
                new Chart(ctx2, {
                    type: 'line',
                    data: {
                        labels: dadosFluxo.map(d => d.name),
                        datasets: [
                            { label: 'Receitas', data: dadosFluxo.map(d => d.income), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', borderWidth: 2, tension: 0.4, fill: true },
                            { label: 'Despesas', data: dadosFluxo.map(d => d.expense), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', borderWidth: 2, tension: 0.4, fill: true }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }

        function toast(msg, tipo = 'success') {
            const t = document.createElement('div');
            t.className = `toast ${tipo}`;
            t.textContent = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        window.addEventListener('click', e => {
            if (e.target.classList.contains('modal') && e.target === e.target) {
                e.target.classList.remove('active');
            }
        });

        window.addEventListener('load', init);
    </script>
</body>
</html>
